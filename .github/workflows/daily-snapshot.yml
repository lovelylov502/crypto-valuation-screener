name: Daily screener observations

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 09:17 KST.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: screener-observations
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Read the last successful collection baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('snapshot-baseline', { recursive: true });
            const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'daily-snapshot.yml', status: 'success', per_page: 1 });
            if (!runs.data.workflow_runs.length) return;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: runs.data.workflow_runs[0].id });
            const artifact = artifacts.data.artifacts.find(a => a.name.startsWith('screener-') && !a.expired);
            if (!artifact) return;
            const download = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: artifact.id, archive_format: 'zip' });
            fs.writeFileSync('snapshot-baseline.zip', Buffer.from(download.data));
      - name: Expand baseline
        run: if [ -f snapshot-baseline.zip ]; then unzip -q snapshot-baseline.zip -d snapshot-baseline; fi
      - run: npm run snapshot:capture
        env:
          SCREENER_BASELINE_DIR: snapshot-baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screener-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-output/
          retention-days: 60
          if-no-files-found: error
      - name: Warm the existing website cache
        run: node scripts/warm-screener.mjs
