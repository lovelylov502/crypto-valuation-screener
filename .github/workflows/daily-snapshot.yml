name: Verified screener publication

on:
  schedule:
    # Native occurrences are recovery wakes; only authenticated receipts prove regular slots.
    - cron: "0 2,8,14,20 * * *"
    - cron: "30 2,8,14,20 * * *"
    - cron: "0 3,9,15,21 * * *"
    - cron: "0 4,10,16,22 * * *"
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      scheduler_receipt:
        description: "Signed Vercel scheduler receipt; leave empty for manual runs"
        type: string
        required: false
      scheduler_signature:
        description: "HMAC signature for the scheduler receipt"
        type: string
        required: false
      bootstrap_url:
        description: "First initialization only: preserved audited seed asset URL"
        type: string
        required: false
      bootstrap_sha256:
        description: "SHA-256 of that preserved seed asset"
        type: string
        required: false
      publication_correction_parent:
        description: "Maintenance only: exact current journal with proved invalid market acquisition"
        type: string
        required: false
      publication_correction_target:
        description: "Maintenance only: exact confirmed baseline journal to restore"
        type: string
        required: false
      failed_observation_parent:
        description: "Maintenance only: exact interrupted start journal"
        type: string
        required: false
      failed_observation_run:
        description: "Maintenance only: failed publication workflow run ID"
        type: string
        required: false
      failed_observation_attempt:
        description: "Maintenance only: exact failed run attempt"
        type: string
        required: false

permissions:
  contents: write
  actions: read

# The sole writer, including manual runs. No deploy/request path may publish data.
concurrency:
  group: screener-publication
  cancel-in-progress: false
  queue: max

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCREENER_BOOTSTRAP_URL: ${{ inputs.bootstrap_url }}
      SCREENER_BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 }}
      SCREENER_SCHEDULER_RECEIPT: ${{ inputs.scheduler_receipt }}
      SCREENER_SCHEDULER_SIGNATURE: ${{ inputs.scheduler_signature }}
      SCREENER_SCHEDULER_SECRET: ${{ secrets.SCREENER_SCHEDULER_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SCREENER_GITHUB_SCHEDULE: ${{ github.event.schedule }}
      SCREENER_POINTER_CORRECTION: ${{ inputs.publication_correction_parent != '' || inputs.publication_correction_target != '' }}
      SCREENER_FAILED_OBSERVATION: ${{ inputs.failed_observation_parent != '' || inputs.failed_observation_run != '' || inputs.failed_observation_attempt != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Validate exclusive maintenance inputs
        if: env.SCREENER_POINTER_CORRECTION == 'true' || env.SCREENER_FAILED_OBSERVATION == 'true'
        env:
          MAINTENANCE_CONFLICT: ${{ (inputs.publication_correction_parent != '' || inputs.publication_correction_target != '') && (inputs.failed_observation_parent != '' || inputs.failed_observation_run != '' || inputs.failed_observation_attempt != '') || inputs.scheduler_receipt != '' || inputs.scheduler_signature != '' || inputs.bootstrap_url != '' || inputs.bootstrap_sha256 != '' }}
        run: test "$MAINTENANCE_CONFLICT" != true
      - name: Check maintenance correction code
        if: env.SCREENER_POINTER_CORRECTION == 'true' || env.SCREENER_FAILED_OBSERVATION == 'true'
        run: npm test
      - name: Append reviewed publication correction without collection
        if: env.SCREENER_POINTER_CORRECTION == 'true'
        env:
          CORRECTION_PARENT: ${{ inputs.publication_correction_parent }}
          CORRECTION_TARGET: ${{ inputs.publication_correction_target }}
        run: npx tsx scripts/correct-publication.ts commit "$CORRECTION_PARENT" "$CORRECTION_TARGET"
      - name: Preserve verified failed observations without collection
        if: env.SCREENER_FAILED_OBSERVATION == 'true'
        env:
          FAILED_PARENT: ${{ inputs.failed_observation_parent }}
          FAILED_RUN: ${{ inputs.failed_observation_run }}
          FAILED_ATTEMPT: ${{ inputs.failed_observation_attempt }}
        run: npx tsx scripts/preserve-failed-observation.ts commit "$FAILED_PARENT" "$FAILED_RUN" "$FAILED_ATTEMPT"
      - name: Check slot completion, active lease and retry eligibility
        if: env.SCREENER_POINTER_CORRECTION != 'true' && env.SCREENER_FAILED_OBSERVATION != 'true'
        id: due
        env:
          SCREENER_SCHEDULER_RECEIPT: ${{ inputs.scheduler_receipt }}
          SCREENER_SCHEDULER_SIGNATURE: ${{ inputs.scheduler_signature }}
          SCREENER_SCHEDULER_SECRET: ${{ secrets.SCREENER_SCHEDULER_SECRET }}
        run: npx tsx scripts/publication-job.ts due
      - run: npm test
        if: steps.due.outputs.collect == 'true'
      - name: Persist collection start and retain the current verified pointer
        id: start
        if: steps.due.outputs.collect == 'true'
        run: npx tsx scripts/publication-job.ts start
      - name: Collect and validate candidate against the published baseline
        if: steps.start.outputs.claimed == 'true'
        timeout-minutes: 12
        run: npm run snapshot:capture
      - name: Archive result and atomically publish only a passing candidate
        if: always() && steps.start.outputs.claimed == 'true'
        run: npx tsx scripts/publication-job.ts finish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screener-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-output/
          retention-days: 60
          if-no-files-found: warn
