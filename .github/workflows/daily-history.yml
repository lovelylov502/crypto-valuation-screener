name: Daily raw history

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum provider CSV requests (0–200)
        type: string
        default: "200"
      max_estimated_writes:
        description: Maximum run credits within the shared monthly cap (8–2000000)
        type: string
        default: "200000"
      time_budget_seconds:
        description: Collection and import time budget (60–2400 seconds)
        type: string
        default: "2400"

permissions:
  contents: write

concurrency:
  group: daily-valuation-history
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'lovelylov502/crypto-valuation-screener' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RAW_TAG: daily-raw-${{ github.run_id }}-${{ github.run_attempt }}
      QUEUE_TAG: daily-raw-queue-${{ github.run_id }}-${{ github.run_attempt }}
      RAW_RUN_ID: daily-raw-${{ github.run_id }}-${{ github.run_attempt }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Normalize the verified canonical repository remote
        run: |
          if [ "$GITHUB_REPOSITORY" != "lovelylov502/crypto-valuation-screener" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "daily_raw_workflow_repository_mismatch" >&2
            exit 1
          fi
          canonical="https://github.com/lovelylov502/crypto-valuation-screener.git"
          for remote in "$(git remote get-url origin)" "$(git remote get-url --push origin)"; do
            if [ "$remote" != "$canonical" ] && [ "$remote" != "${canonical%.git}" ]; then
              echo "daily_raw_workflow_repository_mismatch" >&2
              exit 1
            fi
          done
          git remote set-url origin "$canonical"
          git remote set-url --push origin "$canonical"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Validate limits and create a private cache outside Git
        env:
          REQUEST_LIMIT: ${{ inputs.max_requests || '200' }}
          WRITE_LIMIT: ${{ inputs.max_estimated_writes || '200000' }}
          TIME_LIMIT: ${{ inputs.time_budget_seconds || '2400' }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync,mkdirSync} from 'node:fs';
          import {join} from 'node:path';
          const limits=[['REQUEST_LIMIT',0,200],['WRITE_LIMIT',8,2000000],['TIME_LIMIT',60,2400]];
          for(const [key,min,max] of limits){const n=Number(process.env[key]);if(!/^\d+$/.test(process.env[key]??'')||!Number.isSafeInteger(n)||n<min||n>max)throw Error('Invalid '+key);}
          const cache=join(process.env.RUNNER_TEMP,'daily-raw-cache');mkdirSync(cache,{recursive:true,mode:0o700});
          appendFileSync(process.env.GITHUB_ENV,`RAW_CACHE=${cache}\nREQUEST_LIMIT=${process.env.REQUEST_LIMIT}\nWRITE_LIMIT=${process.env.WRITE_LIMIT}\nRAW_DEADLINE=${Math.floor(Date.now()/1000)+Number(process.env.TIME_LIMIT)}\n`);
          NODE
      - name: Restore the verified durable queue (a missing seed blocks collection)
        id: restore
        run: npx tsx scripts/daily-raw-queue-state.ts --restore --cache "$RAW_CACHE"
      - name: Prepare the latest verified sources and read current budget
        id: prepare
        run: npx tsx scripts/continue-daily-raw.ts --prepare --cache "$RAW_CACHE"
      - name: Continue pending receipts and acquire the next fair request batch
        id: acquire
        run: |
          remaining=$(( RAW_DEADLINE - $(date +%s) ))
          if [ "$remaining" -lt 1 ]; then remaining=1; fi
          npx tsx scripts/continue-daily-raw.ts --cache "$RAW_CACHE" --max-requests "$REQUEST_LIMIT" --time-budget-seconds "$remaining" --maintenance-reserve 500000
      - name: Archive new original responses and verify their public hashes
        id: archive
        if: always() && steps.restore.outcome == 'success' && steps.acquire.outcome != 'skipped'
        run: |
          if [ ! -f "$RAW_CACHE/queue-csv-manifest.json" ]; then
            printf '%s' '{"schema":1,"files":[]}' > "$RAW_CACHE/queue-csv-manifest.json"
          fi
          previous=()
          if [ -f "$RAW_CACHE/archive-manifest.json" ]; then previous=(--previous-manifest archive-manifest.json); fi
          npx tsx scripts/archive-daily-raw.ts --cache "$RAW_CACHE" --tag "$RAW_TAG" --csv-manifest queue-csv-manifest.json --manifest-output archive-manifest-next.json "${previous[@]}"
      - name: Preserve archive pointers before attempting database work
        id: mark
        if: always() && steps.archive.outcome == 'success'
        run: npx tsx scripts/continue-daily-raw.ts --mark-archives --cache "$RAW_CACHE" --archive-manifest "$RAW_CACHE/archive-manifest-next.json"
      - name: Stage raw dates selected by the queue
        id: stage
        if: steps.acquire.outcome == 'success' && steps.mark.outcome == 'success'
        run: |
          remaining=$(( RAW_DEADLINE - $(date +%s) ))
          if [ "$remaining" -lt 1 ]; then exit 0; fi
          npx tsx scripts/sync-daily-raw.ts --local --cache "$RAW_CACHE" --database sealed.sqlite --run-id "$RAW_RUN_ID-stage" --reference "$RAW_CACHE/reference.json" --supplemental-receipts "$RAW_CACHE/supplemental" --csv-manifest "$RAW_CACHE/queue-csv-manifest.json" --selection-manifest "$RAW_CACHE/queue-selection.json" --archive-manifest "$RAW_CACHE/archive-manifest-next.json" --time-budget-seconds "$remaining"
      - name: Import merged raw rows within the shared free quota
        id: import
        if: steps.stage.outcome == 'success'
        run: |
          remaining=$(( RAW_DEADLINE - $(date +%s) ))
          if [ "$remaining" -lt 1 ] || [ ! -f "$RAW_CACHE/sealed.sqlite" ]; then exit 0; fi
          limit=$(node --input-type=module -e 'import {readFileSync} from "node:fs";const report=JSON.parse(readFileSync(process.env.RAW_CACHE+"/queue-report.json"));const cap=Math.min(Number(process.env.WRITE_LIMIT),report.recommendedMaxEstimatedWrites);if(!Number.isSafeInteger(cap)||cap<0)throw Error("Invalid recommendation");console.log(cap);')
          if [ "$limit" -lt 8 ]; then exit 0; fi
          npx tsx scripts/sync-daily-raw.ts --cache "$RAW_CACHE" --database sealed.sqlite --run-id "$RAW_RUN_ID" --max-estimated-writes "$limit" --time-budget-seconds "$remaining" --batch-size 1000
      - name: Advance queue progress only from actual database checkpoints
        id: acknowledge
        if: always() && steps.restore.outcome == 'success' && steps.import.outcome != 'skipped'
        run: |
          if [ ! -f "$RAW_CACHE/sealed.sqlite" ]; then exit 0; fi
          if node --import tsx --input-type=module <<'NODE'
          import {connectHistory} from './lib/historyDatabase.ts';
          import {getDailyRawCheckpoint} from './lib/dailyRawDatabase.ts';
          const db=connectHistory();try{process.exitCode=await getDailyRawCheckpoint(db,process.env.RAW_RUN_ID,'copy:staging')?0:2;}finally{db.close();}
          NODE
          then
            npx tsx scripts/continue-daily-raw.ts --ack-import --cache "$RAW_CACHE" --database sealed.sqlite --import-run-id "$RAW_RUN_ID"
          fi
      - name: Publish the durable queue even when provider or database work pauses
        if: always() && steps.restore.outcome == 'success'
        env:
          ORIGINAL_ARCHIVE_FAILED: ${{ steps.archive.outcome == 'failure' }}
        run: |
          manifest=()
          if [ -f "$RAW_CACHE/archive-manifest-next.json" ]; then manifest=(--archive-manifest archive-manifest-next.json)
          elif [ -f "$RAW_CACHE/archive-manifest.json" ]; then manifest=(--archive-manifest archive-manifest.json); fi
          retry=()
          if [ "$ORIGINAL_ARCHIVE_FAILED" = "true" ]; then retry=(--retry-only); fi
          npx tsx scripts/daily-raw-queue-state.ts --publish --cache "$RAW_CACHE" --tag "$QUEUE_TAG" "${manifest[@]}" "${retry[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-raw-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-raw-cache/*report.json
          retention-days: 30
          if-no-files-found: ignore
