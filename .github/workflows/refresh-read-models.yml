name: Refresh verified publication reads

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-read-model-writer
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.repository == 'lovelylov502/crypto-valuation-screener' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Normalize the verified canonical repository remote
        run: |
          canonical="https://github.com/lovelylov502/crypto-valuation-screener.git"
          for remote in "$(git remote get-url origin)" "$(git remote get-url --push origin)"; do
            if [ "$remote" != "$canonical" ] && [ "$remote" != "${canonical%.git}" ]; then exit 1; fi
          done
          git remote set-url origin "$canonical"
          git remote set-url --push origin "$canonical"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Prepare completed files from local history without hosted SQL
        run: npx tsx scripts/publish-read-artifacts.ts --cache "$RUNNER_TEMP/verified-read-maintenance" --publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verified-read-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-read-maintenance/*report.json
          retention-days: 30
          if-no-files-found: warn
