name: Verified screener publication

on:
  schedule:
    # Two collection slots. Backup wakes at +30/+60m only collect if no start was recorded.
    - cron: "0 2,14 * * *"
    - cron: "30 2,14 * * *"
    - cron: "0 3,15 * * *"
  workflow_dispatch:
    inputs:
      scheduler_receipt:
        description: "Signed Vercel scheduler receipt; leave empty for manual runs"
        type: string
        required: false
      scheduler_signature:
        description: "HMAC signature for the scheduler receipt"
        type: string
        required: false
      bootstrap_url:
        description: "First initialization only: preserved audited seed asset URL"
        type: string
        required: false
      bootstrap_sha256:
        description: "SHA-256 of that preserved seed asset"
        type: string
        required: false

permissions:
  contents: write

# The sole writer, including manual runs. No deploy/request path may publish data.
concurrency:
  group: screener-publication
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCREENER_BOOTSTRAP_URL: ${{ inputs.bootstrap_url }}
      SCREENER_BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Check whether this collection slot already started
        id: due
        env:
          SCREENER_SCHEDULER_RECEIPT: ${{ inputs.scheduler_receipt }}
          SCREENER_SCHEDULER_SIGNATURE: ${{ inputs.scheduler_signature }}
          SCREENER_SCHEDULER_SECRET: ${{ secrets.SCREENER_SCHEDULER_SECRET }}
        run: npx tsx scripts/publication-job.ts due
      - run: npm test
        if: steps.due.outputs.collect == 'true'
      - name: Persist collection start and retain the current verified pointer
        id: start
        if: steps.due.outputs.collect == 'true'
        run: npx tsx scripts/publication-job.ts start
      - name: Collect and validate candidate against the published baseline
        if: steps.due.outputs.collect == 'true'
        timeout-minutes: 12
        run: npm run snapshot:capture
      - name: Archive result and atomically publish only a passing candidate
        if: always() && steps.start.outcome == 'success'
        run: npx tsx scripts/publication-job.ts finish
      - uses: actions/upload-artifact@v7
        if: always() && steps.start.outcome == 'success'
        with:
          name: screener-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-output/
          retention-days: 60
          if-no-files-found: warn
